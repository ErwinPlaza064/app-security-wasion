[variables]
    NIXPACKS_PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo_pgsql",
    "php84Extensions.pgsql",
    "php84Extensions.gd",
    "php84Extensions.intl",
    "php84Extensions.zip",
    "php84Extensions.bcmath",
    "php84Extensions.mbstring",
    "php84Extensions.openssl",
    "php84Packages.composer",
    "nodejs_20",
    "git",
    "nginx",
    "iproute2"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=php+",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan filament:upgrade"
]

[start]
cmd = "chmod +x docker/start.sh && ./docker/start.sh"

[variables]
    NIXPACKS_PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo_mysql",
    "php84Extensions.gd",
    "php84Extensions.intl",
    "php84Extensions.zip",
    "php84Packages.composer",
    "nodejs_20",
    "git"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=php+",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force ; php artisan db:seed --force ; php artisan storage:link ; php artisan serve --host=0.0.0.0 --port=$PORT"

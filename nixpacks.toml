[phases.setup]
nixPkgs = [
    "php84",
    "php84Packages.composer",
    "php84Extensions.pdo_pgsql",
    "php84Extensions.pdo_mysql",
    "php84Extensions.mbstring",
    "php84Extensions.iconv",
    "php84Extensions.tokenizer",
    "php84Extensions.bcmath",
    "php84Extensions.fileinfo",
    "php84Extensions.curl",
    "php84Extensions.zip",
    "php84Extensions.dom",
    "php84Extensions.gd",
    "nodejs",
    "postgresql_17"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install && npm run build",
    "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache storage/app/temp-restores",
    "chmod -R 775 storage bootstrap/cache",
    "php artisan config:cache"
]

[variables]
    PHP_INI_SCAN_DIR = "/app"

[start]
    cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
